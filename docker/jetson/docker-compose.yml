version: '3.8'

services:
  mirena_ws:
    container_name: mirena_ws
    build:
      context: ..
      dockerfile: Dockerfile.jetson
    privileged: true
    restart: unless-stopped
    runtime: nvidia
    network_mode: host
    ipc: host
    group_add:
      - "44"
      - "992"
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_FORCE_PTX_JIT=0
    volumes:
      - /dev/dri:/dev/dri
      - /dev:/dev
      - ../..:/home/mirena/mirena_ws
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /usr/share/vulkan/icd.d:/usr/share/vulkan/icd.d:ro
      - /lib/modules:/lib/modules:ro
      - cuda_cache:/home/mirena/.nv/ComputeCache

    tty: true
    stdin_open: true

volumes:
  cuda_cache:

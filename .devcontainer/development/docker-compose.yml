version: '3.8'

services:
  mirena_ws:
    container_name: mirena_ws_container
    build:
      context: ../../docker/
      dockerfile: Dockerfile.dev
    
    tty: true
    stdin_open: true

    privileged: true
    network_mode: host
    ipc: host
    group_add:
      - "44"
      - "992"
    
    devices:
      - /dev/dri:/dev/dri
      - /dev:/dev

    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1

    volumes:
      - ..:/home/mirena/mirena_ws:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /usr/share/vulkan/icd.d:/usr/share/vulkan/icd.d:ro

    command: /bin/zsh
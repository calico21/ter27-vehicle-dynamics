/mirena_planning:
  ros__parameters:
    mission: skidpad

# Open unrolled path (both circles plus the exit); stop at the last gate.
# laps = 0 selects open-track behaviour: the run ends at the end of the planned
# path. laps > 0 counts laps from arc-length progress and ends the run
# stop_distance metres past the final crossing. Either way the finish is done by
# cutting the reference short so the MPC brakes into the gap on its own.
# Every key here must be declared in MpcNode's constructor -- rclcpp rejects
# setting an undeclared parameter and the supervisor fails the mission on that.
/mirena_control:
  ros__parameters:
    laps: 0

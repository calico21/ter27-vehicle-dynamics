# Real-hardware parameter overrides for the TeR vehicle.
# Pass to real.launch.py via: params:=/path/to/custom.yaml

# ── Lidar ─────────────────────────────────────────────────────────────────────
mirena_lidar:
  ros__parameters:
    self_ip: "192.168.1.102"
    lidar_ip: "192.168.1.200"
    msop_port: 6699
    difop_port: 7788

# ── Camera ────────────────────────────────────────────────────────────────────
mirena_camera:
  ros__parameters:
    video_device: "/dev/video0"
    frame_id: "camera_optical_frame"
    image_width: 640
    image_height: 480
    fps: 90
    camera_info_url: "file:///home/mirena/mirena_ws/src/mirena_hardware/config/camera_info.yaml"
    camera_name: "mirena_camera"



# ── CAN Bus ───────────────────────────────────────────────────────────────────
mirena_can_bus:
  ros__parameters:
    can_interface: "can0"   # use vcan0 for bench testing

# ── Supervisor ────────────────────────────────────────────────────────────────
mirena_supervisor:
  ros__parameters:
    nodes_to_monitor:
      - mirena_slam
      - mirena_planning
      - MPCNode
      - mirena_perception

# ── Planning ──────────────────────────────────────────────────────────────────
mirena_planning:
  ros__parameters:
    mission: trackdrive

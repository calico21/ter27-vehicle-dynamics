mirena_camera:
  ros__parameters:
    video_device: "/dev/ter_camera_video"
    image_width: 640
    image_height: 480
    fps: 90
    frame_id: "camera_optical_frame"
    camera_name: "mirena_camera"
    # Points to the calibration result from Step 5 of our previous chat
    camera_info_url: "file:///home/mirena/mirena_ws/src/mirena_hardware/config/camera_info.yaml"

/mirena_lidar:
  ros__parameters:
    self_ip: "192.168.1.102"
    lidar_ip: "192.168.1.200"
    msop_port: 6699
    difop_port: 7788
  
/mirena_imu:
  ros__parameters:
    imu_device: "/dev/ter_IMU"

mirena_can:
  ros__parameters:
    can_interface: "can0"
    can_bitrate: 500000
    auto_bringup: true   # node runs `ip link set <iface> up type can bitrate <rate>` on startup